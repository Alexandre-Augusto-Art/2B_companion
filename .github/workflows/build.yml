name: build
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - run: ./gradlew :core:test :androidApp:lintDebug :androidApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: 2B-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: ./gradlew.bat :desktopApp:test --console=plain
